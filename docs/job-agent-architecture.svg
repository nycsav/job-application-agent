<rect x="602" y="312" width="328" height="150" rx="10" fill="#33291a" stroke="#e0a64d" stroke-width="1.6"/>
<text x="766" y="338" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Next.js + CopilotKit on Vercel</text>
<text x="766" y="358" fill="#f0d8a8" font-size="11.5" text-anchor="middle">live front-end view (besides Notion)</text>
<line x1="620" y1="370" x2="912" y2="370" stroke="#5c4a2a"/>
<text x="620" y="392" fill="#f4f6fa" font-size="11.5">&#8226; Pipeline board: New &#8594; Materials &#8594; Approved &#8594; Applied</text>
<text x="620" y="412" fill="#f4f6fa" font-size="11.5">&#8226; Per-role card: score, cover-letter preview, resume ver.</text>
<text x="620" y="432" fill="#f4f6fa" font-size="11.5">&#8226; In-app copilot actions: re-scan &#183; edit letter &#183; approve</text>
<text x="620" y="452" fill="#f0d8a8" font-size="11.5">&#8226; Reads Notion &#183; calls the same agent endpoints</text>
<path d="M602,440 C470,470 360,470 332,485" stroke="#e0a64d" stroke-width="1.3" fill="none" stroke-dasharray="4 4" marker-end="url(#ar)"/>
<text x="470" y="462" fill="#e0a64d" font-size="10.5" text-anchor="middle">approve / trigger from UI</text>
<rect x="602" y="492" width="328" height="94" rx="9" fill="#20242e" stroke="#3a4150"/>
<text x="620" y="514" fill="#f4f6fa" font-size="12" font-weight="700">Legend</text>
<rect x="620" y="524" width="22" height="13" rx="3" fill="none" stroke="#3fb5a8" stroke-dasharray="5 3"/><text x="650" y="535" fill="#cdd5e0" font-size="11">&#8249;parallel&#8250; fan-out subagents</text>
<rect x="620" y="544" width="22" height="13" rx="3" fill="#3a1f24" stroke="#d98a8a"/><text x="650" y="555" fill="#cdd5e0" font-size="11">&#8249;gated&#8250; human-in-the-loop</text>
<rect x="620" y="564" width="22" height="13" rx="3" fill="#143041" stroke="#5aa9d6"/><text x="650" y="575" fill="#cdd5e0" font-size="11">Notion = single source of truth</text>
</svg>
