<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Proposed parallel-agent job application architecture</title>
<desc>Four job sources fan out to parallel Claude scan subagents, which score and dedupe into Notion as the system of record. From Notion, one gated path generates materials and submits with human approval; a second path feeds a Next.js plus CopilotKit front-end on Vercel.</desc>
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa4b5"/></marker>
</defs>
<rect x="0" y="0" width="960" height="660" fill="#12151c"/>
<text x="30" y="34" fill="#f4f6fa" font-size="20" font-weight="700">Job Application Agent &#8212; parallel-agent build</text>
<text x="30" y="56" fill="#9aa4b5" font-size="13">Sources &#8594; parallel scan &#8594; score &#8594; Notion (source of truth) &#8594; gated apply + live front-end</text>
<g font-size="13" font-weight="600">
<rect x="30" y="80" width="135" height="44" rx="8" fill="#2a2f3a" stroke="#4a5160"/><text x="97" y="107" fill="#f4f6fa" text-anchor="middle">LinkedIn</text>
<rect x="180" y="80" width="135" height="44" rx="8" fill="#2a2f3a" stroke="#4a5160"/><text x="247" y="107" fill="#f4f6fa" text-anchor="middle">Ladders</text>
<rect x="330" y="80" width="135" height="44" rx="8" fill="#2a2f3a" stroke="#4a5160"/><text x="397" y="107" fill="#f4f6fa" text-anchor="middle">Indeed</text>
<rect x="480" y="80" width="135" height="44" rx="8" fill="#2a2f3a" stroke="#4a5160"/><text x="547" y="107" fill="#f4f6fa" text-anchor="middle">JobRight</text>
</g>
<g stroke="#9aa4b5" stroke-width="1.5" fill="none">
<path d="M97,124 L322,158" marker-end="url(#ar)"/><path d="M247,124 L322,158" marker-end="url(#ar)"/>
<path d="M397,124 L323,158" marker-end="url(#ar)"/><path d="M547,124 L324,158" marker-end="url(#ar)"/>
</g>
<rect x="30" y="160" width="585" height="46" rx="8" fill="#15333033" stroke="#3fb5a8" stroke-dasharray="6 4"/>
<text x="322" y="182" fill="#f4f6fa" font-size="13.5" font-weight="700" text-anchor="middle">Parallel scan subagents &#183; Claude Agent SDK</text>
<text x="322" y="199" fill="#bfe6df" font-size="11.5" text-anchor="middle">&#8249;parallel&#8250; one agent per source &#8594; normalized roles</text>
<path d="M322,206 L322,232" stroke="#9aa4b5" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="234" width="585" height="42" rx="8" fill="#2a2f3a" stroke="#4a5160"/>
<text x="322" y="260" fill="#f4f6fa" font-size="13" font-weight="600" text-anchor="middle">Score &#183; scoreRole() + hard filters (salary / location) &#8594; dedupe vs Notion</text>
<path d="M322,276 L322,300" stroke="#9aa4b5" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="192" y="302" width="260" height="54" rx="9" fill="#143041" stroke="#5aa9d6" stroke-width="1.6"/>
<text x="322" y="326" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Notion Career Command Center</text>
<text x="322" y="345" fill="#bcdcef" font-size="11.5" text-anchor="middle">system of record</text>
<path d="M285,356 L210,388" stroke="#9aa4b5" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="30" y="390" width="300" height="48" rx="8" fill="#15333033" stroke="#3fb5a8" stroke-dasharray="6 4"/>
<text x="180" y="412" fill="#f4f6fa" font-size="13" font-weight="700" text-anchor="middle">Materials subagents</text>
<text x="180" y="429" fill="#bfe6df" font-size="11.5" text-anchor="middle">&#8249;parallel&#8250; 1 per 8+ role &#183; resume + cover letter</text>
<path d="M180,438 L180,464" stroke="#9aa4b5" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="466" width="300" height="46" rx="8" fill="#3a1f24" stroke="#d98a8a" stroke-width="1.6"/>
<text x="180" y="489" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">&#9940; HUMAN APPROVAL GATE</text>
<text x="180" y="505" fill="#f0c9c9" font-size="11" text-anchor="middle">&#8249;sequential&#8250; nothing submits without you</text>
